<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><!-- ENGINE --></head>
<body>
  <script>
    verify(async () => {
      const label = document.createElement('button');
      label.textContent = 'Test label';
      label.title = 'Test label';
      document.body.append(label);
      await settle();
      check('translated text is not translated again', label.textContent, 'Shared label');
      check('translated title is not translated again', label.title, 'Shared label');

      label.firstChild.nodeValue = 'Run';
      label.title = 'Run';
      await settle();
      check('new text from the app', label.textContent, 'Ausführen');
      check('new attribute from the app', label.title, 'Ausführen');
      label.firstChild.nodeValue = 'Shared label';
      label.title = 'Shared label';
      await settle();
      check('the same text from the app still translates', label.textContent, 'Final label');
      check('the same title from the app still translates', label.title, 'Final label');
    });
  </script>
</body>
</html>
