<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    nav, .agy-composer-footer, .model-group { display: flex; align-items: center; }
    .agy-composer-footer { justify-content: space-between; gap: 8px; }
    .agy-composer-footer > button { flex: none; white-space: nowrap; }
    .model-group { min-width: 0; }
    .model-group > button { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #right { width: 225px; }
  </style>
</head>
<body>
  <section id="left" data-testid="conversation-view" data-cascade-id="10000000-0000-0000-0000-000000000000">
    <div class="agy-composer-footer">
      <div class="model-group"><button>+</button><button data-testid="model-selector-trigger">Claude Sonnet 5.5</button></div>
      <button data-testid="input-cancel-button">Stop</button>
    </div>
  </section>
  <section id="right" data-testid="conversation-view" data-cascade-id="20000000-0000-0000-0000-000000000000">
    <div class="agy-composer-footer">
      <div class="model-group"><button>+</button><button data-testid="model-selector-trigger">Claude Sonnet 5.5 Medium</button></div>
      <button>Send</button>
    </div>
  </section>
  <section id="side" data-testid="side-question-tab-content">
    <article data-testid="side-question-tab-conversation" data-cascade-id="30000000-0000-0000-0000-000000000000"></article>
    <div data-testid="side-question-tab-composer"><div class="agy-composer-footer"><button>Send</button></div></div>
  </section>
  <section id="subagent" data-testid="subagent-tab-conversation" data-cascade-id="40000000-0000-0000-0000-000000000000">
    <nav>Subagent</nav>
  </section>
  <script>
    const metricsByID = {
      1: {used: 1000, limit: 10000, speed: 11, cacheRate: 0.5, firstToken: 0.35},
      2: {used: 2000, limit: null, speed: 22, cacheRate: 0.1, firstToken: null},
      3: {used: 3000, limit: 10000, speed: 33, cacheRate: 0, firstToken: 1},
      4: {used: 4000, limit: 10000, speed: 44, cacheRate: 0.25, firstToken: 2},
    };
    let quotaCalls = 0, metricCalls = 0;
    let quotaReply = [{name: 'Gemini Models', buckets: [
      {name: '', window: 'weekly', fraction: 0.934, reset: null},
      {name: 'Five Hour Limit Remaining', window: '', fraction: 1, reset: '2026-11-25T12:00:00Z'},
    ]}, {name: 'Claude and GPT models', buckets: [
      {name: '', window: '5h', fraction: 0, reset: null},
      {name: '', window: 'weekly', fraction: null, reset: null},
    ]}];
    window.require = () => ({ ipcRenderer: {
      invoke: async (channel, id) => {
        if (channel === 'regravity:model-quota') {
          quotaCalls++;
          return quotaReply;
        }
        metricCalls++;
        check('requests use the metrics channel', channel, 'regravity:session-metrics');
        return metricsByID[id[0]] ?? null;
      },
    } });
  </script>
  <!-- ENGINE -->
  <script>
    let wideHeight, narrowHeight;
    document.addEventListener('DOMContentLoaded', () => {
      wideHeight = document.getElementById('left').offsetHeight;
      narrowHeight = document.getElementById('right').offsetHeight;
    }, { once: true });
    verify(async () => {
      const control = (id) => document.querySelector('#' + id + ' .ai18n-usage-control');
      const progress = (id) => control(id)?.style.getPropertyValue('--ai18n-context-used');
      const detailFor = (id) => document.getElementById(control(id).getAttribute('aria-describedby'));
      const values = (id) => [...detailFor(id).querySelectorAll('dd')].map(el => el.textContent);
      await settle(150);
      const lang = document.documentElement.lang;
      const localLabels = {
        it: ['Metriche della sessione', 'Contesto utilizzato', 'Velocità media di generazione',
          'Percentuale di riscontri nella cache', 'Tempo al primo token', 'Quota residua del modello',
          'Settimanale', 'Prossimo ripristino'],
        id: ['Metrik sesi', 'Penggunaan konteks', 'Kecepatan keluaran rata-rata', 'Rasio hit cache',
          'Waktu hingga token pertama', 'Sisa kuota model', 'Mingguan', 'Waktu reset'],
        pl: ['Statystyki sesji', 'Wykorzystanie kontekstu', 'Średnia prędkość generowania',
          'Odsetek trafień w pamięci podręcznej', 'Czas do pierwszego tokena', 'Pozostały limit modelu',
          'Tygodniowo', 'Odnowienie limitu']
      }[lang];
      if (localLabels) {
        control('left').click();
        await settle(300);
        const detail = detailFor('left');
        check('session title', detail.getAttribute('aria-label'), localLabels[0]);
        check('metric names', [...detail.querySelectorAll('dt')].map(el => el.textContent).join('|'), localLabels.slice(1,5).join('|'));
        const table = detail.querySelector('table');
        check('localized quota', table.rows[0].cells[0].textContent, localLabels[5]);
        check('localized period', table.rows[0].cells[1].textContent, localLabels[6]);
        check('localized reset time', table.rows[1].cells[2].firstChild.title.startsWith(localLabels[7]), true);
        check('model name retained', table.rows[2].cells[0].textContent, 'Claude / GPT');
        return;
      }
      if (document.documentElement.lang === 'ar') {
        control('left').dispatchEvent(new PointerEvent('pointerenter'));
        await settle(300);
        const table = detailFor('left').querySelector('table');
        const row = table.rows[2];
        const model = row.cells[0];
        const balance = table.rows[1].cells[1].firstChild;
        check('Arabic table direction', getComputedStyle(table).direction, 'rtl');
        check('model column is on the right', model.getBoundingClientRect().left > row.cells[1].getBoundingClientRect().left, true);
        check('mixed model label', model.textContent, 'Claude / GPT');
        check('model name direction', getComputedStyle(model).direction, 'ltr');
        check('isolated percentage', balance.tagName, 'BDI');
        check('percentage direction', getComputedStyle(balance).direction, 'ltr');
        check('percentage uses the Arabic number format', balance.textContent,
          new Intl.NumberFormat('ar', {style:'percent', maximumFractionDigits:1}).format(0.934));
        return;
      }
      check('one ring in each conversation pane', document.querySelectorAll('.ai18n-usage-control').length, 4);
      const unrelated = document.body.appendChild(document.createElement('span'));
      const calls = metricCalls;
      let scans = 0;
      const query = document.querySelectorAll.bind(document);
      document.querySelectorAll = selector => {
        if (selector.includes('.agy-composer-footer')) scans++;
        return query(selector);
      };
      for (let i = 0; i < 8; i++) {
        unrelated.hidden = !unrelated.hidden;
        await settle(30);
      }
      document.querySelectorAll = query;
      check('unrelated visibility changes do not scan the page', scans, 0);
      check('unrelated visibility changes do not sample metrics', metricCalls, calls);
      check('left pane usage', progress('left'), '10%');
      check('right pane missing a context limit', values('right').slice(0, 2).join('|'), '≈2k tokens|22 tok/s');
      check('side question uses its own data', progress('side'), '30%');
      check('read-only subagent uses its own data', progress('subagent'), '40%');
      check('read-only subagent ring stays in its toolbar', control('subagent').parentElement.tagName, 'NAV');
      check('ring follows the native model picker', control('left').previousElementSibling.dataset.testid, 'model-selector-trigger');
      check('ring follows the model picker in a narrow pane', control('right').previousElementSibling.dataset.testid,
        'model-selector-trigger');
      check('wide composer height', document.getElementById('left').offsetHeight, wideHeight);
      check('narrow composer height', document.getElementById('right').offsetHeight, narrowHeight);
      const narrowFooter = document.querySelector('#right .agy-composer-footer');
      check('send control stays inside the narrow toolbar',
        narrowFooter.lastElementChild.getBoundingClientRect().right <= narrowFooter.getBoundingClientRect().right + 1, true);
      check('no visible metrics text in toolbar', control('left').textContent, '');
      check('closed panels do not fetch quota', quotaCalls, 0);
      control('left').dispatchEvent(new PointerEvent('pointerenter'));
      const detail = detailFor('left');
      check('no popover on a brief pointer pass', detail.matches(':popover-open'), false);
      await settle(270);
      check('details open on hover', detail.matches(':popover-open'), true);
      const table = detail.querySelector('.ai18n-quota table');
      const rowText = row => [...row.cells].map(cell => cell.textContent).join('|');
      check('quota uses just a header and two group rows', table.rows.length, 3);
      check('periods have compact localized headings', rowText(table.rows[0]).replace(/\s/g, ''), '模型剩余额度|每周|5小时');
      check('quota is available while generating', rowText(table.rows[1]), 'Gemini|93.4%|100%');
      check('periods align across groups and missing values differ from zero', rowText(table.rows[2]), 'Claude / GPT|—|0%');
      check('reset time is available on the corresponding percentage', table.rows[1].cells[2].firstChild.title.startsWith('重置时间'), true);
      check('quota section fits within four lines', table.offsetHeight <= 80, true);
      check('context use has a single labeled row', [...detail.querySelectorAll('dt')].map(dt => dt.textContent).join('|'),
        '上下文已用|平均输出速度|缓存命中率|首 token 延迟');
      check('estimated share, used and total tokens, speed, cache and latency', values('left').join('|'),
        '≈10% · 1k / 10k tokens|11 tok/s|50%|0.35 s');
      control('left').dispatchEvent(new PointerEvent('pointerleave'));
      detail.dispatchEvent(new PointerEvent('pointerenter'));
      await settle(165);
      check('moving into details keeps it open', detail.matches(':popover-open'), true);
      detail.dispatchEvent(new PointerEvent('pointerleave'));
      await settle(165);
      check('details close on pointer exit', detail.matches(':popover-open'), false);
      control('left').click();
      control('left').dispatchEvent(new PointerEvent('pointerleave'));
      await settle(165);
      check('click pins details', detail.matches(':popover-open'), true);
      document.body.dispatchEvent(new PointerEvent('pointerdown', {bubbles: true}));
      check('outside click closes details', detail.matches(':popover-open'), false);

      Object.assign(metricsByID[1], {speed: 19, used: 40681, limit: 512000});
      metricsByID[2].used = 999;
      document.querySelector('[data-testid="input-cancel-button"]').remove();
      await settle(4100);
      check('generation end refreshes speed', values('left')[1], '19 tok/s');
      check('large token counts use decimal thousands', values('left')[0], '≈7.9% · 40.7k / 512k tokens');
      check('hover exposes the full token counts', detail.querySelector('dd').title, '40,681 / 512,000 tokens');
      check('small token counts stay exact', values('right')[0], '≈999 tokens');

      const right = document.getElementById('right');
      right.dataset.cascadeId = '50000000-0000-0000-0000-000000000000';
      await settle(100);
      check('switch clears measurements from the old conversation', values('right').join('|'), '—|—|—|—');
      check('a conversation without data still has a quota control', control('right').hidden, false);
      check('switching conversations keeps the ring after the model picker', control('right').previousElementSibling.dataset.testid,
        'model-selector-trigger');
      right.removeAttribute('data-cascade-id');
      await settle(100);
      control('right').click();
      await settle(30);
      check('new chat without an ID can open quota', detailFor('right').querySelector('.ai18n-quota tbody th').textContent, 'Gemini');
      let finishOld;
      quotaReply = new Promise(resolve => { finishOld = resolve; });
      control('left').click();
      quotaReply = null;
      control('right').click();
      await settle(30);
      finishOld([{name: 'old response', buckets: []}]);
      await settle(30);
      check('a late response does not overwrite the active panel', detailFor('right').querySelector('.ai18n-quota').textContent,
        '暂无额度数据');
      check('quota failure preserves conversation metrics', values('left')[1], '19 tok/s');
      right.hidden = true;
      await settle(100);
      check('hidden panes release their ring', Boolean(control('right')), false);
    });
  </script>
</body>
</html>
