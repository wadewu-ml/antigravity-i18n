<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><!-- ENGINE --></head>
<body>
  <button id="control" title="Run">Open</button>
  <p id="fragment">Please <span><strong>Open</strong></span> the folder.</p>
  <div style="display:flex"><span id="independent">Run</span><span>Unknown label</span></div>
  <div role="tooltip"><span id="tooltip">Go Back</span><span id="shortcut">Ctrl+[</span></div>
  <p id="permission">Configure global allowed and denied resource permissions. <a href="#">Learn more</a>.</p>
  <button id="knowledge" aria-label="Knowledge Work">Knowledge Work</button>
  <div data-testid="live-agent-turn" id="voice"><span>Run</span> <span>Open</span></div>
  <div data-testid="planner-response-text"><img id="attachment" alt="Open"></div>
  <div data-testid="side-question-question" style="display:flex"><span id="side-label">Help</span><span id="side-content" class="truncate">Open</span></div>
  <div id="editor" contenteditable="plaintext-only" aria-label="Open">Run</div>
  <div translate="no"><button id="remote" title="Open">Run</button></div>
  <input id="input" value="Run" placeholder="Open">
  <div id="timer">Worked for 5s</div>
  <div id="terms" class="text-sm text-muted-foreground mt-auto pt-4">By using this app, you agree to its <a href="https://antigravity.google/terms">Terms of Service</a></div>
  <div class="text-sm text-muted-foreground leading-relaxed"><span id="project">Also includes <span class="text-link">Global Permissions</span> when working in this project.</span></div>
  <div data-testid="mcp-server-browser-sign-in"><span id="provider" role="status"></span></div>
  <script>
    const byId = id => document.getElementById(id);
    const text = id => byId(id).textContent;
    const terms = byId('terms');
    const termsCopy = terms.firstChild;
    const link = terms.lastChild;
    let clicks = 0;
    link.addEventListener('click', event => { event.preventDefault(); clicks++; });

    const project = byId('project');
    const automation = document.createTextNode('This project was created for an automation. ');
    project.prepend(automation);
    const providerName = document.createTextNode('Run');
    byId('provider').append('Finish signing in to ', providerName, ' in your browser.');

    verify(async () => {
      for (const [id, expected] of Object.entries({
        control: '打开', fragment: 'Please Open the folder.', independent: '运行',
        tooltip: '后退', shortcut: 'Ctrl+[', permission: '配置全局允许和拒绝的资源权限。 了解更多.',
        knowledge: '知识工作', voice: 'Run Open', 'side-label': '帮助', 'side-content': 'Open',
        editor: 'Run', remote: 'Run', timer: '运行了 5秒',
        terms: '使用此应用即表示你同意其服务条款',
        project: '此项目为自动化创建。在此项目中工作时，也会包含全局权限。',
        provider: '请在浏览器中完成 Run 的登录。'
      })) check(id, text(id), expected);
      check('UI tooltip', byId('control').title, '运行');
      check('editor label', byId('editor').getAttribute('aria-label'), '打开');
      check('remote tooltip', byId('remote').title, 'Open');
      check('input value', byId('input').value, 'Run');
      check('input placeholder', byId('input').placeholder, '打开');
      check('terms nodes', terms.firstChild === termsCopy && terms.lastChild === link, true);
      check('link destination', link.href, 'https://antigravity.google/terms');
      link.click();
      check('original link handler', clicks, 1);

      automation.remove();
      providerName.nodeValue = 'Open';
      termsCopy.nodeValue = 'Unknown terms before ';
      byId('control').firstChild.nodeValue = 'Close';
      byId('attachment').alt = 'Run';
      byId('voice').firstChild.firstChild.nodeValue = 'Open';
      await settle();
      check('React-only deletion', text('project'), '在此项目中工作时，也会包含全局权限。');
      check('updated provider name', text('provider'), '请在浏览器中完成 Open 的登录。');
      check('unmatched inline sentence', terms.textContent, 'Unknown terms before Terms of Service');
      check('updated UI label', text('control'), '关闭');
      check('updated user attachment alt', byId('attachment').alt, 'Run');
      check('updated voice content', text('voice'), 'Open Open');
    });
  </script>
</body>
</html>
